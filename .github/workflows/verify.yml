# The plugin's gate. Until this file existed there was none: `deploy.yml` is the
# only other workflow, it is filtered to `site/**`, and it runs the site build
# gate. So `drydock-audit.test.mjs` (75 cases) and `enforce-owns.test.mjs` (12)
# had never run automatically — every release was verified only because somebody
# chose to run them by hand — and `assert-matrix.mjs`, which exists to stop the
# A3 figure drifting across documents, sat inside a workflow that ignores
# `docs/**`. Editing `docs/a3-gate-compliance.md`, the exact edit that caused
# that drift, triggered nothing.
#
# NO `paths:` FILTER, DELIBERATELY. A path filter is what broke the last gate,
# and these jobs cost seconds: every script here imports Node builtins only, so
# there is no `npm ci`, no lockfile, no `node_modules`. Filtering would save
# nothing and reintroduce the one failure this file exists to fix.
#
# `assert-copy.mjs` is NOT here — it reads `out/index.html` and needs a real
# build, so it stays in `deploy.yml` where the build already happens.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: plugin tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported Node range. 22 is the stated minimum
        # (`path.matchesGlob` is stdlib from 22, per drydock/README.md); 24 is
        # what the repo is developed on.
        node: [22, 24]
        # WINDOWS IS NOT OPTIONAL HERE. This code carries explicit Windows
        # handling that exists because it was got wrong: backslash-to-POSIX
        # normalisation in the ownership hook, CRLF splitting in the plan parser
        # (splitting on "\n" alone parsed ZERO fields out of every task), and
        # padded `wc -l` output. The repo is developed on Windows and every one
        # of those regressions would have shipped green on Linux alone.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node drydock/scripts/drydock-audit.test.mjs
      - run: node drydock/hooks/enforce-owns.test.mjs

  docs:
    name: honesty matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node site/scripts/assert-matrix.mjs

      # INFORMATIONAL, never a gate. Plan 004 fails `validate-plan` permanently
      # and on purpose: its wave 2.1 same-wave dependency is accepted and
      # recorded as deviation 15, because repairing a closed record to satisfy a
      # validator written afterwards would make the plan describe an execution
      # that did not happen. Gating on this would mean a red build nobody is
      # allowed to fix, which is a build people learn to ignore. The output is
      # here to be read; the exit code is not a verdict.
      - name: validate the plan corpus (informational)
        run: |
          for p in docs/plans/*.md; do
            node drydock/scripts/drydock-audit.mjs validate-plan "$p" || true
          done

  e2e:
    name: generated E2E specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

      # The export uses absolute `/drydock/_next/…` paths, so serving `out/` at
      # a server root 404s every asset. Mount it where it expects to be —
      # CLAUDE.md's documented recipe.
      - name: serve the export at its basePath
        run: |
          mkdir -p /tmp/dd && ln -sfn "$PWD/site/out" /tmp/dd/drydock
          (cd /tmp/dd && python3 -m http.server 5173 &)
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:5173/drydock/ && break || sleep 0.5
          done
          curl -sf -o /dev/null -w "target: %{http_code}\n" http://127.0.0.1:5173/drydock/

      # EPHEMERAL, and that is the point. `e2e/README.md` records that
      # `@playwright/test` is not installed here and that seatrial is forbidden
      # from adding it — a constraint on the repo's dependencies, not on whether
      # anyone may ever run the specs. Installing into a scratch directory keeps
      # `site/package.json` and its lockfile untouched while closing the loop
      # seatrial leaves open: until 2026-09-02 these specs had never been
      # executed by a test runner at all.
      - name: run the specs (Playwright installed outside the repo)
        run: |
          mkdir -p /tmp/e2e && cp e2e/*.spec.ts /tmp/e2e/
          cd /tmp/e2e
          echo '{"name":"drydock-e2e","private":true}' > package.json
          npm i --no-save --no-fund --no-audit @playwright/test@1.62.1
          npx playwright install --with-deps chromium
          npx playwright test . --reporter=list
